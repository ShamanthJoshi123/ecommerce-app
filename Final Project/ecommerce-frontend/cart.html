<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <link rel="stylesheet" href="css/cart.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="navbar">

    <a href="index.html" class="logo-link">
        <h2>ShopEasy</h2>
    </a>

    <div>

        <a href="index.html" title="Home">
            <i class="fa fa-home"></i>
        </a>

        <a href="products.html" title="Products">
            <i class="fa fa-store"></i>
        </a>

        <a href="cart.html" class="cart-icon" title="Cart">
            <i class="fa fa-shopping-cart"></i>
            <span id="cartCount">0</span>
        </a>

        <a href="orders.html" title="Orders">
            <i class="fa fa-box"></i>
        </a>
        <button id="loginBtn" onclick="goToLogin()" style="display:none;">
            Login
        </button>

        <button id="logoutBtn" onclick="logout()" style="display:none;">
            Logout
        </button>
    </div>

</header>

<h2>Your Shopping Cart</h2>

<div class="cart-container">

    <div id="cart-items"></div>

    <div class="summary">
        <h3>Order Summary</h3>

        <p>Items Total: <span id="itemsTotal">0</span></p>
        <p>Delivery: <span style="color:green;">FREE</span></p>
        <p>Discount: <span id="discount">0</span></p>

        <hr>

        <h2>Total: <span id="total">0</span></h2>

        <button onclick="goToCheckout()" class="checkout-btn">
            Proceed to Checkout
        </button>
    </div>

</div>
<script src="js/common.js"></script>
<script src="js/cart.js"></script>


</body>
</html>
