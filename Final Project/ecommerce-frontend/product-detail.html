<!DOCTYPE html>
<html>
<head>
    <title>Product Detail</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/product-detail.css">
</head>
<body>
<header class="navbar">

    <a href="index.html" class="logo-link">
        <h2>ShopEasy</h2>
    </a>

    <div>

        <a href="index.html" title="Home">
            <i class="fa fa-home"></i>
        </a>

        <a href="products.html" title="Products">
            <i class="fa fa-store"></i>
        </a>

        <a href="cart.html" class="cart-icon" title="Cart">
            <i class="fa fa-shopping-cart"></i>
            <span id="cartCount">0</span>
        </a>

        <a href="orders.html" title="Orders">
            <i class="fa fa-box"></i>
        </a>
        <button id="loginBtn" onclick="goToLogin()" style="display:none;">
            Login
        </button>

        <button id="logoutBtn" onclick="logout()" style="display:none;">
            Logout
        </button>
    </div>

</header>

<div class="container">

    <img id="image" class="product-img">

    <div class="details">
        <h2 id="name"></h2>
        <p id="price"></p>
        <p id="desc"></p>

        <button onclick="addToCartDetail()">Add to Cart</button>
    </div>

</div>
<script src="js/common.js"></script>
<script src="js/product-detail.js"></script>

</body>
</html>
